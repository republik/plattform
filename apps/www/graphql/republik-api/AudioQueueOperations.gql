fragment AudioQueueItemRef on AudioQueueItemRef {
  id
  sequence
  mediaId
  repoId
  sanityId
  userProgress {
    id
    secs
  }
}

query AudioQueueQuery {
  userAudioQueue {
    ...AudioQueueItemRef
  }
}

mutation AddAudioQueueItemRef($entity: AudioQueueEntityInput!, $sequence: Int) {
  audioQueueItems: addAudioQueueItemRef(entity: $entity, sequence: $sequence) {
    ...AudioQueueItemRef
  }
}

mutation MoveAudioQueueItem($id: ID!, $sequence: Int!) {
  audioQueueItems: moveAudioQueueItemRef(id: $id, sequence: $sequence) {
    id
    sequence
  }
}

mutation RemoveAudioQueueItem($id: ID!) {
  audioQueueItems: removeAudioQueueItemRef(id: $id) {
    id
  }
}

mutation ClearAudioQueue {
  audioQueueItems: clearAudioQueueRefs {
    id
  }
}

mutation ReorderAudioQueue($ids: [ID!]!) {
  audioQueueItems: reorderAudioQueueRefs(ids: $ids) {
    id
    sequence
  }
}

fragment AudioQueueItem on AudioQueueItem {
  id
  sequence
  document {
    id
    meta {
      title
      path
      publishDate
      image
      audioCoverCrop {
        x
        y
        width
        height
      }
      coverForNativeApp: audioCover(properties: { width: 1024, height: 1024 })
      coverMd: audioCover(properties: { width: 256, height: 256 })
      coverSm: audioCover(properties: { width: 128, height: 128 })
      audioSource {
        mediaId
        kind
        mp3
        aac
        ogg
        durationMs
        userProgress {
          id
          secs
        }
      }
      format {
        id
        meta {
          title
          color
          shareLogo
          shareBackgroundImage
          shareBackgroundImageInverted
        }
      }
    }
  }
}

mutation AddAudioQueueItems($entity: AudioQueueEntityInput!, $sequence: Int) {
  audioQueueItems: addAudioQueueItem(entity: $entity, sequence: $sequence) {
    ...AudioQueueItem
  }
}

query LatestArticles($count: Int!, $after: String) {
  latestArticles: documents(first: $count, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      id
      meta {
        title
        path
        publishDate
        image
        audioCoverCrop {
          x
          y
          width
          height
        }
        coverSm: audioCover(properties: { width: 128, height: 128 })
        audioSource {
          mediaId
          kind
          mp3
          aac
          ogg
          durationMs
          userProgress {
            id
            secs
          }
        }
        format {
          id
          meta {
            title
            color
            shareLogo
            shareBackgroundImage
            shareBackgroundImageInverted
          }
        }
      }
    }
  }
}

query MyRepublik {
  progress: userCollectionItemsByNames(
    names: ["progress", "bookmarks"]
    progress: UNFINISHED
    first: 2
    uniqueDocuments: true
    lastDays: 30
  ) {
    nodes {
      id
      sanityId
    }
  }

  notifications(first: 2, filter: Document, lastDays: 30) {
    nodes {
      id
      object {
        ... on SanityDocumentRef {
          id
        }
      }
    }
  }
}
